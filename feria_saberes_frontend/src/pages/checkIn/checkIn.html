<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Registro de ingreso a la Feria de Saberes"
    />

    <title>Registro | Feria de Saberes</title>

    <link rel="stylesheet" href="../../assets/css/global.css" />
    <link rel="stylesheet" href="../../assets/css/checkin/checkin.css" />

    <script type="module" src="./checkin.js"></script>
  </head>

  <body>
    <header class="topbar">
      <a class="brand" href="../../index.html"> Feria de Saberes </a>

      <span class="operator-label">Registro</span>
    </header>

    <main class="page-container">
      <section class="checkin-card">
        <div class="card-heading">
          <h1>Registro</h1>
          <p>Completá los datos para registrar el ingreso a la feria.</p>
        </div>

        <div class="card-body">
          <form id="checkin-form">
            <div class="form-group">
              <label for="categoria">Categoría de visitante</label>

              <select id="categoria" name="categoria" required>
                <option value="">Seleccioná una categoría</option>
                <option value="familiar">Familiar</option>
                <option value="alumno">Alumno</option>
                <option value="docente">Docente</option>
                <option value="otro">Otro</option>
              </select>
            </div>

            <div class="form-group">
              <label for="integrantes">Cantidad de integrantes</label>

              <input
                type="number"
                id="integrantes"
                name="integrantes"
                min="1"
                step="1"
                value="1"
                required
              />
            </div>

            <div class="form-group">
              <label for="nombre">Nombre del grupo o persona</label>

              <input
                type="text"
                id="nombre"
                name="nombre"
                maxlength="150"
                placeholder="Ej.: Familia Gómez (opcional)"
              />
            </div>

            <button type="submit" id="submit-button">Registrar ingreso</button>

            <p
              id="form-message"
              class="form-message"
              role="status"
              aria-live="polite"
            ></p>
          </form>

          <div class="info-note">
            Verificá los datos antes de registrar el ingreso.
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">Feria de Saberes · Conocimiento que nos une</footer>
  </body>
</html>
