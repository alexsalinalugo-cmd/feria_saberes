<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Registro de ingreso a la Feria de Saberes"
    />

    <title>Puerta de Ingreso | Feria de Saberes</title>

    <link rel="stylesheet" href="../../assets/css/global.css" />
    <link rel="stylesheet" href="../../assets/css/checkin/checkin.css" />
    <link rel="stylesheet" href="../../components/navbar.css" />
    <script type="module" src="./checkin.js"></script>
  </head>

  <body>
    <header>
      <div id="navbar-placeholder"></div>
    </header>

    <main class="page-container single-column">
      <!-- Card: Formulario de Registro de Ingreso -->
      <section class="checkin-card kiosk-card">
        <div class="card-heading">
          <div class="heading-badge">Control de Puerta</div>
          <h1>Registro de Ingreso</h1>
          <p>
            Completá los datos para registrar la entrada de visitantes a la
            feria.
          </p>
        </div>

        <div class="card-body">
          <form id="checkin-form">
            <div class="form-group">
              <label for="categoria">Categoría de visitante</label>
              <select id="categoria" name="categoria" required>
                <option value="">Seleccioná una categoría</option>
                <option value="familiar">Familiar</option>
                <option value="alumno">Alumno</option>
                <option value="docente">Docente</option>
                <option value="otro">Otro</option>
              </select>
            </div>

            <div class="form-group">
              <label for="integrantes">Cantidad de integrantes</label>
              <input
                type="number"
                id="integrantes"
                name="integrantes"
                min="1"
                step="1"
                value="1"
                required
              />
            </div>

            <div class="form-group">
              <label for="nombre">Nombre del grupo o persona (opcional)</label>
              <input
                type="text"
                id="nombre"
                name="nombre"
                maxlength="150"
                placeholder="Ej.: Familia Gómez, Prof. Martínez..."
              />
            </div>

            <button type="submit" id="submit-button">Registrar ingreso</button>

            <p
              id="form-message"
              class="form-message"
              role="status"
              aria-live="polite"
            ></p>
          </form>

          <div class="info-note">
            <span>Verificá los datos antes de confirmar el registro.</span>
          </div>

          <div class="reports-link-container">
            <a href="/src/pages/reportes/reportes.html" class="reports-link">
              Ir a Estadísticas y Reportes Generales &rarr;
            </a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
