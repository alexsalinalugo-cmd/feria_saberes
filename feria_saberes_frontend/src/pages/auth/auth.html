<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ingresar | Feria de Saberes</title>
    <link rel="stylesheet" href="./auth.css" />
    <link rel="stylesheet" href="../../assets/css/global.css" />
    <link rel="stylesheet" href="../../components/navbar.css" />
  </head>
  <body>
    <div id="navbar-placeholder"></div>

    <main class="auth-container">
      <form id="auth-form" class="auth-card" novalidate>
        <div class="auth-header">
          <h1 id="auth-title">Bienvenido</h1>
          <p id="auth-description">Ingresá tus credenciales para acceder</p>
        </div>

        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Ingresá tu nombre"
            autocomplete="username"
            maxlength="100"
            required
          />
          <span class="error-message" id="nombre-error"></span>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Ingresá tu contraseña"
            autocomplete="current-password"
            required
          />
          <span class="error-message" id="password-error"></span>
        </div>

        <button type="submit" id="btn-submit" class="btn-primary">
          <span class="btn-text">Ingresar</span>
          <span class="spinner hidden" aria-hidden="true"></span>
        </button>

        <div id="auth-alert" class="alert hidden" role="alert"></div>

        <p class="auth-switch">
          <span id="auth-switch-prompt">¿Todavía no tenés cuenta?</span>
          <button type="button" id="btn-toggle-mode">Crear una cuenta</button>
        </p>
      </form>
    </main>

    <script type="module" src="./auth.js"></script>
  </body>
</html>
